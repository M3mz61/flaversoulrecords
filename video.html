<!DOCTYPE html>
<html lang="en">
<head>
    <!-- GoatCounter Analytics Tracking -->
    <script data-goatcounter="https://goatcounter.com"
        async src="//gc.zgo.at/count.js"></script>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Room | Flave R Soul Records</title>
    <style>
        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            margin: 0;
            padding: 0;
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }
        
        /* Centered Top Navigation Header */
        header {
            margin-bottom: 40px;
            border-bottom: 1px solid #000000;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-room-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }

        /* Responsive Widescreen YouTube Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border: 1px solid #000000;
            background-color: #000000;
            margin-bottom: 40px;
            box-sizing: border-box;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Description Box beneath the player */
        .video-meta {
            text-align: center;
            margin-bottom: 50px;
        }
        .video-title {
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .channel-link {
            color: #000000;
            text-decoration: underline;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .channel-link:hover {
            opacity: 0.7;
        }

        /* White Navigation Buttons with Black Text at Bottom */
        .premium-nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 40px;
            border-top: 1px solid #000000;
            padding-top: 30px;
        }
        .premium-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000 !important;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1px solid #000000;
            width: 100%;
            max-width: 280px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .premium-btn:hover {
            background-color: #000000;
            color: #ffffff !important;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Header -->
        <header>
            <h1 class="video-room-title">Flave R Soul Video Room</h1>
        </header>

        <main>
            <!-- 16:9 Responsive YouTube Embed Window -->
            <div class="video-wrapper">
                <!-- Replace the text "YOUR_YOUTUBE_VIDEO_ID_HERE" with your specific YouTube video code -->
                <iframe 
                    src="https://youtube.com" 
                    title="Flave R Soul Featured Video" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Video Metadata & External Links -->
            <div class="video-meta">
                <h2 class="video-title">Featured Release</h2>
                <p>
                    <a href="https://www.youtube.com/@memz_flave_r_soul" class="channel-link" target="_blank" rel="noopener noreferrer">
                        Visit Official YouTube Channel
                    </a>
                </p>
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="premium-nav-container">
                <a href="artists.html" class="premium-btn">Back to Artists</a>
                <a href="foyer.html" class="premium-btn">Return to Foyer</a>
            </div>
        </main>
    </div>

</body>
</html>
