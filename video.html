<!DOCTYPE html>
<html lang="en">
<head>
    <!-- GoatCounter Analytics Tracking -->
    <script data-goatcounter="https://goatcounter.com"
        async src="//gc.zgo.at/count.js"></script>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Room | Flave R Soul Records</title>
    <style>
        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            margin: 0;
            padding: 0;
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }
        
        /* Centered Top Navigation Header */
        header {
            margin-bottom: 50px;
            border-bottom: 1px solid #000000;
            padding-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .main-brand-title {
            font-size: 2.4rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            font-weight: bold;
            line-height: 1.2;
        }
        .sub-room-title {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            font-weight: normal;
            color: #555555;
            line-height: 1.2;
        }

        /* Video Grid Layout (1 column on mobile, 2 columns on desktop) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 50px 30px;
            width: 100%;
            margin-bottom: 40px;
        }
        @media (min-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Individual Video Item Card */
        .video-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* 16:9 Responsive YouTube Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border: 1px solid #000000;
            background-color: #000000;
            margin-bottom: 16px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Video Metadata styling matching original layout */
        .video-title {
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            font-size: 1.4rem;
            margin: 0 0 8px 0;
            font-weight: normal;
            line-height: 1.3;
            letter-spacing: 1px;
        }

        /* Fixed White Navigation Buttons at Bottom */
        .premium-nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 60px;
            border-top: 1px solid #000000;
            padding-top: 30px;
        }
        .premium-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000 !important;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1px solid #000000;
            width: 100%;
            max-width: 280px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .premium-btn:hover {
            background-color: #000000;
            color: #ffffff !important;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Header with Main Title and Sub-title -->
        <header>
            <h1 class="main-brand-title">Flave R Soul Records</h1>
            <div class="sub-room-title">Video Room</div>
        </header>

        <main>
            <!-- Grid Container for Videos -->
            <div class="video-grid">
                
                <!-- Video Item 1 -->
                <div class="video-item">
                    <div class="video-wrapper">
                        <iframe 
                            src="https://www.youtube.com/embed/wnntjfreZpI?si=ggL663XcM6ntDvAe" 
                            title="YouTube video player" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <h2 class="video-title">Black & White Pictures (Black Rose Edition)</h2>
                </div>

                <!-- Video Item 2 -->
                <div class="video-item">
                    <div class="video-wrapper">
                       <iframe 
                               src="https://www.youtube.com/embed/sBJ_W-PLV8w?si=k8sMFCWcH0IgnfFM" 
                               title="YouTube video player" 
                               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                               referrerpolicy="strict-origin-when-cross-origin" 
                               allowfullscreen>
                       </iframe>
                    </div>
                    <h2 class="video-title">White Boy Blues</h2>
                </div>

                <!-- Video Item 3 -->
                <div class="video-item">
                    <div class="video-wrapper">
                       <iframe 
                               src="https://www.youtube.com/embed/lq8WbNNMzzo?si=WJ3XElqkdPhAjgNi" 
                               title="YouTube video player" 
                               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                               referrerpolicy="strict-origin-when-cross-origin" 
                               allowfullscreen>
                       </iframe>
                    </div>
                    <h2 class="video-title">So Glad She's Gone</h2>
                </div>

                <!-- Video Item 4 -->
                <div class="video-item">
                    <div class="video-wrapper">
                       <iframe 
                               src="https://www.youtube.com/embed/QdmXOo-FjJk?si=hSNxfvtMqh8uNn68" 
                               title="YouTube video player" 
                               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                               referrerpolicy="strict-origin-when-cross-origin" 
                               allowfullscreen>
                       </iframe>
                    </div>
                    <h2 class="video-title">Black & White Pictures (Slow Piano Edition)</h2>
                </div>

            </div>

            <!-- Return Navigation Links -->
            <div class="premium-nav-container">
                <a href="artists.html" class="premium-btn">Back to Artists</a>
                <a href="foyer.html" class="premium-btn">Return to Foyer</a>
            </div>
        </main>
    </div>

</body>
</html>
