<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flave R Soul Español</title>
    <style>
        body {
            background-color: #ffffff !important;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Header Group Container */
        .header-group {
            text-align: center;
            margin-bottom: 50px;
        }
        .main-title {
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 2.2rem;
            margin: 0 0 16px 0;
            line-height: 1.2;
        }
        .sub-title {
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-weight: normal;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.2rem;
            margin: 0;
        }

        /* Centered Graphic Element */
        .showcase-disc {
            width: 280px;
            height: 280px;
            background-image: url("Logo/bronze.jpeg"); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            margin-bottom: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        /* Tracklist Section */
        .tracklist-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 50px;
        }
        .track-entry {
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid #000000;
            border-radius: 0px;
            background-color: #ffffff;
        }
        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .track-name {
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-weight: bold;
            font-size: 1.3rem;
            color: #000000;
        }
        .track-version {
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-size: 0.95rem;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .track-meta {
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-size: 0.9rem;
            color: #000000;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        
        /* Direct Audio Player Integration styling */
        audio {
            width: 100%;
            outline: none;
            border: 1px solid #000000;
            background-color: #ffffff;
        }

        /* Premium Return Button Styling */
        .foyer-button {
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-weight: bold;
            font-size: 1rem;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            padding: 12px 30px;
            border: 1px solid #000000;
            border-radius: 0px;
            background: #ffffff;
            transition: background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
            text-align: center;
        }
        .foyer-button:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <div class="header-group">
        <h1 class="main-title">Flave R Soul Español</h1>
        <h2 class="sub-title">The Bronze Room — Spanish Catalog</h2>
    </div>

    <div class="showcase-disc"></div>

    <div class="tracklist-container">
        
        <!-- Track 1: Volver, Volver -->
        <div class="track-entry">
            <div class="track-header">
                <span class="track-name">Volver, Volver - Juan Manuel Gonzales</span>
                <span class="track-version">Original Mix</span>
            </div>
            <span class="track-meta">ISRC: Coming Soon • Release Year: 2026</span>
            <audio controls controlsList="nodownload">
                <source src="Audio/Volver,Volver_2.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Track 2: Amar Y Vivir -->
        <div class="track-entry">
            <div class="track-header">
                <span class="track-name">Amar Y Vivir</span>
                <span class="track-version">Radio Edit</span>
            </div>
            <span class="track-meta">ISRC: Coming Soon • Release Year: 2026</span>
            <audio controls controlsList="nodownload">
                <source src="Audio/Amar y vivir 1st Master -2_1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

    </div>

    <!-- Clear Framed Return Button to foyer.html -->
    <a href="foyer.html" class="foyer-button">Return to Foyer</a>

</body>
</html>
