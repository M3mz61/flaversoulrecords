<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memz & DeeAfro | Flave R Soul Records</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
        }

        /* Profile Image Layout Frame */
        .main-image {
            width: 100%;
            margin-bottom: 30px;
        }
        .main-image img {
            width: 100%;
            height: auto;
            border: 1px solid #000000;
            display: block;
        }
        
        /* Artist Name Heading */
        h1 {
            font-size: 3.8rem;
            margin: 0 0 30px 0;
            font-weight: normal;
            line-height: 1;
            text-align: center;
        }
        
        /* Biography Text Content Block */
        .bio {
            font-size: 1.25rem;
            margin-bottom: 40px;
            text-align: justify;
            color: #000000;
        }

        /* The 4 Gallery Images formatted into a crisp 2x2 mobile grid */
        .numbered-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 40px;
        }
        .numbered-gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid #000000;
            display: block;
        }

        /* Horizontal rule divider */
        hr {
            border: 0;
            border-top: 1px solid #000000;
            width: 100%;
            margin-bottom: 30px;
        }

        /* Clean White Navigation Layout featuring centered framed buttons side-by-side */
        .premium-nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }
        .premium-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 10px 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #000000;
            width: 50%;
            max-width: 220px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <main>
            <!-- Top Main Image Placement (Change src to your preferred main image file name) -->
            <div class="main-image">
                <img src="Artists/bkg.png" alt="Memz & DeeAfro Profile">
            </div>

            <!-- Artist Header Name -->
            <h1>Memz & DeeAfro</h1>
            
            <!-- Biography Text Block Placeholder -->
            <div class="bio">
                <p>Enter biography text for Memz & DeeAfro here. This section will detail their collaborative releases, music styles, and production history under Flave R Soul Records.</p>
            </div>

            <!-- The 4 Gallery Images (Change src files to match your exact camera roll uploads) -->
            <div class="numbered-gallery">
                <img src="Artists/mda2.JPG" alt="Memz & DeeAfro 2">
                <img src="Artists/mda3.JPG" alt="Memz & DeeAfro 3">
                <img src="Artists/mda4.JPG" alt="Memz & DeeAfro 4">
                <img src="Artists/mda5.JPG" alt="Memz & DeeAfro 5">
            </div>

            <!-- Horizontal Break Line -->
            <hr>

            <!-- Custom Side-by-Side Framed White Buttons -->
            <div class="premium-nav-container">
                <a href="artists.html" class="premium-btn">Artists Roster</a>
                <a href="foyer.html" class="premium-btn">Foyer Entry</a>
            </div>
        </main>
    </div>

</body>
</html>
