<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists | Flave R Soul Records</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* Top Navigation Header */
        header {
            margin-bottom: 50px;
            border-bottom: 1px solid #000000;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .roster-title {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
        }
        .premium-btn {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, color 0.2s ease;
            border: 1px solid #000000;
            font-weight: bold;
        }
        .premium-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* 6 Artist Button Grid */
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 40px 30px;
        }
        @media (min-width: 480px) {
            .artist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 768px) {
            .artist-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Card Button Elements */
        .artist-card {
            text-decoration: none;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .artist-card:hover {
            transform: scale(1.02);
        }
        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid #000000;
            margin-bottom: 15px;
            overflow: hidden;
            background-color: #fafafa;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .artist-name {
            font-size: 1.8rem;
            margin: 0;
            font-weight: normal;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Header -->
        <header>
            <h1 class="roster-title">Flave R Soul Roster</h1>
            <a href="foyer.html" class="premium-btn">Back to Foyer</a>
        </header>

        <main>
            <div class="artist-grid">
                
                <!-- 1) Lizzie France -->
                <a href="lizziefrance.html" class="artist-card">
                    <div class="image-container">
                        <img src="Artists/art.JPG" alt="Lizzie France">
                    </div>
                    <h2 class="artist-name">Lizzie France</h2>
                </a>

                <!-- 2) Memz & DeeAfro -->
                <a href="memzdeeafro.html" class="artist-card">
                    <div class="image-container">
                        <img src="Artists/art1.JPG" alt="Memz & DeeAfro">
                    </div>
                    <h2 class="artist-name">Memz & DeeAfro</h2>
                </a>

                <!-- 3) DJ Sonic -->
                <a href="djsonic.html" class="artist-card">
                    <div class="image-container">
                        <img src="Artists/bkg.JPG" alt="DJ Sonic">
                    </div>
                    <h2 class="artist-name">DJ Sonic</h2>
                </a>

                <!-- 4) Juan Manuel Gonzalez -->
                <a href="juanmanuelgonzalez.html" class="artist-card">
                    <div class="image-container">
                        <img src="Artists/art3.JPG" alt="Juan Manuel Gonzalez">
                    </div>
                    <h2 class="artist-name">Juan Manuel Gonzalez</h2>
                </a>

                <!-- 5) Memz -->
                <a href="memz.html" class="artist-card">
                    <div class="image-container">
                        <img src="Artists/art4.JPG" alt="Memz">
                    </div>
                    <h2 class="artist-name">Memz</h2>
                </a>

                <!-- 6) DeeAfro -->
                <a href="deeafro.html" class="artist-card">
                    <div class="image-container">
                        <img src="Artists/art5.JPG" alt="DeeAfro">
                    </div>
                    <h2 class="artist-name">DeeAfro</h2>
                </a>

            </div>
        </main>
    </div>

</body>
</html>
