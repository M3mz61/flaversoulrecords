<!DOCTYPE html>
<html lang="en">
<head>
    <script data-goatcounter="https://goatcounter.com"
        async src="//gc.zgo.at/count.js"></script>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists | Flave R Soul Records</title>
    <style>
        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            margin: 0;
            padding: 0;
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }
        
        /* Centered Top Navigation Header */
        header {
            margin-bottom: 50px;
            border-bottom: 1px solid #000000;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .roster-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }

        /* 6 Artist Button Grid */
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 40px 30px;
            width: 100%;
        }
        @media (min-width: 480px) {
            .artist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 768px) {
            .artist-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Card Button Elements */
        .artist-card {
            text-decoration: none;
            color: #000000 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .artist-card:hover {
            transform: scale(1.02);
        }
        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid #000000;
            margin-bottom: 16px;
            overflow: hidden;
            background-color: #ffffff;
            box-sizing: border-box;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .artist-name {
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            font-size: 1.4rem;
            margin: 0;
            font-weight: normal;
            line-height: 1.3;
            letter-spacing: 1px;
            text-transform: none;
        }

        /* Fixed White Navigation Buttons with Black Text at Bottom */
        .premium-nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 60px;
            border-top: 1px solid #000000;
            padding-top: 30px;
        }
        .premium-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000 !important;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 1px solid #000000;
            width: 100%;
            max-width: 280px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .premium-btn:hover {
            background-color: #000000;
            color: #ffffff !important;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation Header - Centered with Updated Title -->
        <header>
            <h1 class="roster-title">Flave R Soul Artists</h1>
        </header>

        <main>
            <div class="artist-grid">
                
                <!-- 1) Lizzie France -->
                <a href="lizziefrance.html" class="artist-card" aria-label="View Lizzie France Profile">
                    <div class="image-container">
                        <img src="Artists/art.JPG" alt="Lizzie France">
                    </div>
                    <h2 class="artist-name">Lizzie France</h2>
                </a>

                <!-- 2) Memz & DeeAfro -->
                <a href="mnd.html" class="artist-card" aria-label="View Memz & DeeAfro Profile">
                    <div class="image-container">
                        <img src="Artists/bkg.png" alt="Memz & DeeAfro">
                    </div>
                    <h2 class="artist-name">Memz & DeeAfro</h2>
                </a>

                <!-- 3) DJ Sonic -->
                <a href="djsonic.html" class="artist-card" aria-label="View DJ Sonic Profile">
                    <div class="image-container">
                        <img src="Artists/sonic1.JPG" alt="DJ Sonic">
                    </div>
                    <h2 class="artist-name">DJ Sonic</h2>
                </a>

                <!-- 4) Juan Manuel Gonzalez -->
                <a href="juanmanuelgonzalez.html" class="artist-card" aria-label="View Juan Manuel Gonzalez Profile">
                    <div class="image-container">
                        <img src="Artists/art3.PNG" alt="Juan Manuel Gonzalez">
                    </div>
                    <h2 class="artist-name">Juan Manuel Gonzalez</h2>
                </a>

                <!-- 5) Memz -->
                <a href="memz.html" class="artist-card" aria-label="View Memz Profile">
                    <div class="image-container">
                        <img src="Artists/art4.jpeg" alt="Memz">
                    </div>
                    <h2 class="artist-name">Memz</h2>
                </a>

                <!-- 6) DeeAfro -->
                <a href="deeafro.html" class="artist-card" aria-label="View DeeAfro Profile">
                    <div class="image-container">
                        <img src="Artists/art5.JPG" alt="DeeAfro">
                    </div>
                    <h2 class="artist-name">DeeAfro</h2>
                </a>

            </div>

            <!-- Return to Foyer Link -->
            <div class="premium-nav-container">
                <a href="foyer.html" class="premium-btn">Return to Foyer</a>
            </div>
        </main>
    </div>

</body>
</html>
