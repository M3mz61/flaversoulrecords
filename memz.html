<!DOCTYPE html>
<html lang="en">
<head>
    <script data-goatcounter="https://goatcounter.com"
        async src="//gc.zgo.at/count.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memz Room — Flave R Soul</title>
    <style>
        body {
            background-color: #ffffff !important;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #000000 !important;
        }

        /* Fixed Symmetrical top speaker layout */
        .speaker-row {
            display: flex;
            justify-content: space-between; /* Strictly forces left and right separation */
            align-items: center;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        .speaker-row a {
            width: 140px; /* Locks structural width to match original design */
            display: block;
        }

        .speaker-row img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Unified Media & Gallery Container */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }

        .content-container a {
            width: 100%;
            display: block;
        }

        .content-container img {
            width: 100%;
            height: auto;
            border: 1px solid #000000;
            display: block;
        }

        /* Embed wrapper matching the exact width of the image stack */
        .embed-wrapper {
            width: 100%;
        }

        .embed-wrapper iframe {
            width: 100% !important;
            border: none;
            display: block;
        }

        /* Navigation Matrix controls matching label typography */
        .foyer-button {
            display: inline-block;
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-weight: bold;
            font-size: 1rem;
            color: #000000 !important;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            padding: 10px 25px;
            border: 1px solid #000000;
            border-radius: 2px;
            background: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 40px;
        }
        
        .foyer-button:hover {
            background-color: #000000;
            color: #ffffff !important;
            letter-spacing: 4px;
        }

        footer {
            margin-top: 20px;
            width: 100%;
        }

        .footer-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .footer-nav .foyer-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0;
            text-align: center;
            white-space: nowrap;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Symmetrical Pumping Speakers Layout -->
    <div class="speaker-row">
        <a href="https://flaversoulrecords.com" target="_blank" rel="noopener noreferrer">
            <img src="mnd/Spkr_Memz1.gif" alt="Left Speaker Component">
        </a>
        <a href="https://spotify.com" target="_blank" rel="noopener noreferrer">
            <img src="mnd/Spkr_Memz1.gif" alt="Right Speaker Component">
        </a>
    </div>

    <!-- Unified Stack Container (Aligns Embeds & Images to the exact same width) -->
    <div class="content-container">

        <!-- Spotify Embed (Positioned First) -->
        <div class="embed-wrapper">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://spotify.com" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <!-- Traxsource Embed (Positioned Second) -->
        <div class="embed-wrapper">
            <iframe height="240" scrolling="no" src="https://traxsource.com"></iframe>
        </div>

        <!-- YouTube Embed 1 -->
        <div class="embed-wrapper">
            <iframe height="281" src="https://youtube.com" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <!-- YouTube Embed 2 -->
        <div class="embed-wrapper">
            <iframe height="281" src="https://youtube.com" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <!-- Studio Archive Gallery Items -->
        <a href="https://spotify.com" target="_blank" rel="noopener noreferrer">
            <img src="mnd/memz01.jpeg" alt="Memz Close-up Portrait from the Polluted Records Launch Promotional Photo Shoot">
        </a>
        <a href="https://spotify.com" target="_blank" rel="noopener noreferrer">
            <img src="mnd/M2.jpeg" alt="Flave R Soul engineering at the mixing console">
        </a>
        <a href="https://spotify.com" target="_blank" rel="noopener noreferrer">
            <img src="mnd/memzeuphonix.jpeg" alt="Flave R Soul tracking at the Euphonix system hardware rig">
        </a>
        <a href="https://spotify.com" target="_blank" rel="noopener noreferrer">
            <img src="mnd/Memz Euph.jpg" alt="Memz sitting at the SSL G Series mixing console">
        </a>

    </div>

    <!-- Symmetrical Navigation Matrix Route -->
    <footer>
        <div class="footer-nav">
            <a href="mnd.html" class="foyer-button">Return to Memz & DeeAfro</a>
            <a href="foyer.html" class="foyer-button">Return to Foyer</a>
        </div>
    </footer>

    <!-- Persistent Brand Watermark -->
    <p style="font-family: 'Bodoni 72', serif; font-weight: bold; font-size: 0.8rem; color: #000000; text-transform: uppercase; letter-spacing: 3px; text-align: center; margin-top: 60px; margin-bottom: 20px;">
        Flave R Soul Records <a href="reality.html" style="color: #000000; text-decoration: none; font-weight: bold; cursor: default;">©️</a> 2026
    </p>

</body>
</html>
