        body {
            background-color: #ffffff !important;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #000000 !important;
        }

        /* Symmetrical top speaker layout */
        .speaker-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .speaker-row a {
            width: 45%;
            display: block;
        }

        .speaker-row img {
            width: 100%;
            height: auto;
            max-width: 140px;
            display: block;
        }

        /* Embed Container Styles */
        .embed-container {
            width: 100%;
            max-width: 560px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .embed-container iframe {
            max-width: 100%;
            border: none;
        }

        /* Master landscape image stack */
        .studio-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }

        .studio-gallery a {
            width: 100%;
            display: block;
        }

        .studio-gallery img {
            width: 100%;
            height: auto;
            border: 1px solid #000000;
            display: block;
        }

        /* Navigation Matrix controls matching label typography */
        .foyer-button {
            display: inline-block;
            font-family: "Bodoni 72", "Bodoni MT", "Didot", serif;
            font-weight: bold;
            font-size: 1rem;
            color: #000000 !important;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            padding: 10px 25px;
            border: 1px solid #000000;
            border-radius: 2px;
            background: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 40px;
        }
        
        .foyer-button:hover {
            background-color: #000000;
            color: #ffffff !important;
            letter-spacing: 4px;
        }

        footer {
            margin-top: 20px;
            width: 100%;
        }

        .footer-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .footer-nav .foyer-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0;
            text-align: center;
            white-space: nowrap;
            font-size: 0.9rem;
        }
