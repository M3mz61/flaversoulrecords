<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizzie France | Flave R Soul Records</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            font-family: "Bodoni 72", "Bodoni MT", Didot, "Playfair Display", serif;
            line-height: 1.6;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Top Centered Main Profile Image matching the circular logo style position */
        .main-image {
            width: 100%;
            max-width: 260px;
            margin-bottom: 20px;
        }
        .main-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Bordered Content Card Layout matching your screenshot format */
        .content-card {
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            padding: 40px 30px;
            margin-bottom: 40px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        
        h1 {
            font-size: 2rem;
            margin: 0 0 20px 0;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .bio {
            font-size: 1.15rem;
            color: #000000;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 4 Numbered Images Grid matching the card container width boundaries */
        .numbered-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 20px;
        }
        .numbered-gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid #000000;
            display: block;
        }

        /* Premium Actions Row containing white buttons with black text frames */
        .premium-nav-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
        }
        .premium-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 12px 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #000000;
            width: 100%;
            max-width: 280px;
            text-align: center;
            transition: background-color 0.2s ease;
        }
        .premium-btn:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Artist Image placement matching top circle asset alignment -->
        <div class="main-image">
            <img src="Artists/ljf.jpg" alt="Lizzie France Main Profile">
        </div>

        <!-- Main Card Section Container -->
        <div class="content-card">
            <h1>Lizzie France</h1>
            
            <div class="bio">
                <p>Enter biography text for Lizzie France here. This section will highlight her unique contribution, vocal history, and upcoming releases under Flave R Soul Records.</p>
            </div>

            <!-- Lower Grid Gallery Images dropped inside the card baseline -->
            <div class="numbered-gallery">
                <img src="Artists/ljf2.JPG" alt="Lizzie France 2">
                <img src="Artists/ljf3.JPG" alt="Lizzie France 3">
                <img src="Artists/ljf4.JPG" alt="Lizzie France 4">
                <img src="Artists/ljf5.JPG" alt="Lizzie France 5">
            </div>
        </div>

        <!-- Navigation Actions built precisely to your button structure -->
        <div class="premium-nav-container">
            <a href="artists.html" class="premium-btn">Artists Directory</a>
            <a href="foyer.html" class="premium-btn">Return to Foyer</a>
        </div>
    </div>

</body>
</html>
